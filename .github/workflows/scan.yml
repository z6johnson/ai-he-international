name: Weekly feed scan

# Pulls tracked RSS/Atom feeds and commits any new items. With the repo
# connected to Vercel, the push triggers an automatic redeploy, so the
# dashboard refreshes itself without any manual step. New items land
# flagged UNTRIAGED until a human writes their "why it matters" line.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run feed scan
        run: python3 scripts/scan.py

      - name: Lint data integrity
        run: python3 scripts/scan.py --check

      - name: Commit new items
        run: |
          # meta.js's last_scan changes on every run; only commit when the
          # scan actually ingested new items.
          if git diff --quiet -- data/items.js; then
            echo "No new items — nothing to commit."
            git checkout -- data/meta.js
          else
            git config user.name "nud-scan-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/items.js data/meta.js
            git commit -m "scan: automated weekly feed ingest"
            git push
          fi
